name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  bank:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bank, migration, configuration and packaging checks
        run: |
          python -m unittest discover -s tests -p "test*bank*.py" -v
          python -m unittest discover -s tests -p test_release.py -v
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended texlive-xetex texlive-lang-chinese poppler-utils
          python -m pip install sympy==1.14.0
      - name: Core and compiled-PDF checks
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools outside the skill
        run: |
          npm install --prefix "$RUNNER_TEMP/mws-browser-qa" --no-save --no-package-lock playwright@1.64.1
          node "$RUNNER_TEMP/mws-browser-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Rebuild and check offline views, formulas and answer images
        env:
          MWS_PLAYWRIGHT_MODULE: ${{ runner.temp }}/mws-browser-qa/node_modules/playwright
        run: |
          python tools/build_browser_example.py
          node tools/check_browser_ui.cjs
          node tools/check_browser_exports.cjs
      - name: Build installable ZIP
        run: python tools/package_skill.py
