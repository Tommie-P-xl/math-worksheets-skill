name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (must match SKILL.md version)
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate tag and package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python -c 'import os,re,pathlib; v=re.search(r"^  version: ([0-9.]+)$",pathlib.Path("SKILL.md").read_text(),re.M).group(1); assert os.environ["RELEASE_TAG"] == "v"+v, "tag/version mismatch"'
          python tools/package_skill.py
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils
          python -m pip install sympy==1.14.0
      - name: Validate runtime and extracted package
        run: python -m unittest discover -s tests -v
      - name: Publish ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --clobber
